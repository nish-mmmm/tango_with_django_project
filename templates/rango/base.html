{% load static %}
{% load rango_template_tags %}

<!DOCTYPE html>
<html>
<head>
    <title>Rango - {% block title_block %}How to Tango with Django!{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{% static 'rango/css/style.css' %}">
</head>
<body>
    <div id="menu">
        <ul>
            <li><a href="{% url 'rango:add_category' %}">Add a New Category</a></li>
            <li><a href="{% url 'rango:about' %}">About</a></li>
            <li><a href="{% url 'rango:index' %}">Index</a></li>
        </ul>
    </div>

    <div id="content">
        {% block body_block %}{% endblock %}
    </div>

    <div id="sidebar">
        {% block sidebar_block %}
            {% get_category_list category %}
        {% endblock %}
    </div>
</body>
</html>
